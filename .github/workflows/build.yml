name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build IPA
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install ldid dpkg make

      - name: Set up Theos
        run: |
          THEOS_DIR="$RUNNER_TEMP/theos"
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS_DIR"
          rm -rf "$THEOS_DIR/sdks"
          git clone --depth 1 https://github.com/theos/sdks.git "$THEOS_DIR/sdks"
          echo "THEOS=$THEOS_DIR" >> "$GITHUB_ENV"
          echo "$THEOS_DIR/bin" >> "$GITHUB_PATH"

      - name: Build package
        run: gmake package FINALPACKAGE=1 -j"$(sysctl -n hw.ncpu)"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: imgui-ipa
          path: packages/imgui.ipa
          if-no-files-found: error
